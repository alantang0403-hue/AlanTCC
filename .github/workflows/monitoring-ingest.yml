name: Monitoring ingestion

on:
  push:
    branches:
      - main
  schedule:
    # Avoid the top of the hour, when GitHub Actions scheduled jobs are most likely to be delayed.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: monitoring-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch and archive monitoring data
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Probe source directly from GitHub runner
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2; do
            for protocol in https http; do
              source_url="${protocol}://swcbapi.monitorsystem.com.tw/dsmon/am/10min_a_ds_data.xml"
              if curl --ipv4 --fail --silent --show-error \
                --connect-timeout 4 --max-time 12 \
                -H "Accept: application/xml,text/xml" \
                -H "User-Agent: Miaoli-Landslide-Monitor/1.0" \
                -o monitoring.xml "${source_url}"; then
                if grep -q '<file_attribute' monitoring.xml && grep -q '<station' monitoring.xml; then
                  echo "available=true" >> "${GITHUB_OUTPUT}"
                  echo "Validated XML from ${protocol} source (round ${round})."
                  exit 0
                fi
              fi
            done
            sleep $((round * 4))
          done
          echo "Direct source unavailable; gateway will perform three additional retry rounds."
          echo "available=false" >> "${GITHUB_OUTPUT}"

      - name: Request GitHub OIDC token and trigger ingestion
        shell: bash
        run: |
          set -euo pipefail

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=miaoli-monitoring-scheduler")"

          oidc_token="$(jq -r '.value // empty' <<< "${oidc_response}")"
          if [[ -z "${oidc_token}" ]]; then
            echo "GitHub did not return an OIDC token."
            exit 1
          fi

          request_body=()
          if [[ "${{ steps.direct.outputs.available }}" == "true" ]]; then
            request_body=(-H "Content-Type: application/xml" --data-binary @monitoring.xml)
          fi

          set +e
          http_code="$(curl --silent --show-error \
            --connect-timeout 15 \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Accept: application/json" \
            "${request_body[@]}" \
            --output gateway-response.json \
            --write-out "%{http_code}" \
            "https://miaoli-monitoring-cron-gateway.alantang0403.chatgpt.site/trigger")"
          curl_status=$?
          set -e

          cat gateway-response.json 2>/dev/null || true
          echo
          if [[ ${curl_status} -ne 0 ]]; then
            echo "Gateway request failed (curl status ${curl_status})."
            exit 1
          fi
          if [[ "${http_code}" != "200" ]] || ! jq -e '.ok == true' gateway-response.json >/dev/null 2>&1; then
            echo "Monitoring ingestion did not succeed (HTTP ${http_code})."
            exit 1
          fi
