name: Monitoring ingestion

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: monitoring-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch and archive monitoring data
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Request GitHub OIDC token and trigger ingestion
        shell: bash
        run: |
          set -euo pipefail

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=miaoli-monitoring-scheduler")"

          oidc_token="$(jq -r '.value // empty' <<< "${oidc_response}")"
          if [[ -z "${oidc_token}" ]]; then
            echo "GitHub did not return an OIDC token."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 3 \
            --retry-delay 15 \
            --retry-max-time 150 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Accept: application/json" \
            "https://miaoli-monitoring-cron-gateway.alantang0403.chatgpt.site/trigger"

          echo
